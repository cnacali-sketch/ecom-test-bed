# Port policy: ONLY caddy publishes to the host. Docker's port publishing
# writes iptables rules ahead of ufw, so a `ports:` mapping here is reachable
# from the public internet no matter what ufw says — publishing postgres/redis/
# rabbitmq is a direct path to the database. Everything else talks over the
# compose network by service name, which stays private.
#
# For local development, use docker-compose.override.yml to re-publish the
# ports you need; compose merges it automatically and it is gitignored.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: savvy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-savvy_dev_password}
      POSTGRES_DB: savvyarchitect
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savvy -d savvyarchitect"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: savvy
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-savvy_dev_password}
    expose:
      - "5672"
      - "15672" # management UI — reach it with `docker compose port`/SSH tunnel
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://savvy:${POSTGRES_PASSWORD:-savvy_dev_password}@postgres:5432/savvyarchitect
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://savvy:${RABBITMQ_PASSWORD:-savvy_dev_password}@rabbitmq:5672//
    expose:
      - "8000"
    volumes:
      # Media-library uploads (app/routers/media.py) live on disk, not in
      # Postgres — without this, a rebuild wipes every uploaded image.
      - media_uploads:/app/media_uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* vars are inlined into the client bundle at build
        # time, so this must be set (via a root .env file or shell env)
        # before `docker compose build`, not just at container run time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  media_uploads:
